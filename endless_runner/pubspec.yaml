name: runner_rush
description: Runner Rush 3D - Endless Runner Game
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.18.0
  shared_preferences: ^2.2.3
  google_fonts: ^6.1.0
  audioplayers: ^5.2.1
  flutter_animate: ^4.3.0
  flame_audio: ^2.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
